services:
  amp-regression-predict-flask:
    mem_limit: 3g # Memory limit for the container
    memswap_limit: 3g # Swap memory limit for the container
    build:
      context: .
    ports:
      - 8889:8888
    volumes:
      - .:/app
    restart: always
    # command: flask run --host=0.0.0.0 --port=8888 --reload --debugger
    command: gunicorn app:app --workers 2 --bind 0.0.0.0:8888 --timeout 3600
    # env_file: .env